name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.28

          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            bin: ".exe"

          - os: macos-latest
            platform: macos
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Zig is only needed for Linux glibc compatibility
      - name: Install Zig
        if: matrix.platform == 'linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        if: matrix.platform == 'linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: cargo zigbuild --release --target ${{ matrix.zig_target }}

      - name: Build (Windows/macOS)
        if: matrix.platform != 'linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        if: matrix.platform != 'windows'
        run: strip "target/${{ matrix.target }}/release/${{ github.event.repository.name }}"

      - name: Package Standard ZIP (Ultra Compression)
        shell: pwsh
        run: |
          $name = "${{ github.event.repository.name }}"
          $binName = if ("${{ matrix.platform }}" -eq "windows") { "$name.exe" } else { "$name" }
          $binPath = "target/${{ matrix.target }}/release/$binName"
          $zipName = "$name-${{ matrix.platform }}.zip"

          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item $binPath -Destination "staging/$binName"

          Get-ChildItem -Path "." -Include "README*", "LICENSE*" -File |
            Copy-Item -Destination "staging/" -ErrorAction SilentlyContinue

          Push-Location staging
          7z a -tzip -mx=9 -mpass=15 "../$zipName" *
          Pop-Location

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-binaries
          path: "*.zip"

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: "*-binaries"
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.sha) }}
          name: "Release: ${{ github.ref_name || github.sha }}"
          files: ./dist/*.zip
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
